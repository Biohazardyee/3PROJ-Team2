services:
  db:
    image: postgres:18.1
    restart: always
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    image: api:latest
    restart: always
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile         # Si tu veux rebuild depuis le docker-compose
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  postgres_data: